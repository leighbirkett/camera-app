<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Room Modeler</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --primary: #FF6B35;
            --secondary: #004E89;
            --accent: #00D9FF;
            --dark: #1A1D29;
            --light: #F7F9FC;
            --success: #06D6A0;
            --warning: #FFD23F;
            --surface: rgba(255, 255, 255, 0.95);
            --overlay: rgba(0, 78, 137, 0.15);
            --shadow: rgba(26, 29, 41, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #1A1D29 0%, #2D3142 100%);
            color: var(--light);
            overflow-x: hidden;
            min-height: 100vh;
        }

        #ar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #camera-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .hud {
            position: fixed;
            z-index: 100;
            pointer-events: none;
        }

        .hud * {
            pointer-events: auto;
        }

        .top-bar {
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem;
            background: linear-gradient(180deg, rgba(26, 29, 41, 0.95) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--surface);
            color: var(--dark);
            border-radius: 2rem;
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: 0 4px 20px var(--shadow);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

        .bottom-controls {
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem;
            background: linear-gradient(0deg, rgba(26, 29, 41, 0.95) 0%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .info-panel {
            width: 100%;
            max-width: 500px;
            padding: 1.5rem;
            background: var(--surface);
            color: var(--dark);
            border-radius: 1rem;
            box-shadow: 0 8px 32px var(--shadow);
            backdrop-filter: blur(10px);
        }

        .info-header {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--secondary);
        }

        .measurement-grid {
            display: grid;
            gap: 0.75rem;
        }

        .measurement-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(0, 78, 137, 0.1);
            font-size: 0.875rem;
        }

        .measurement-label {
            font-weight: 400;
            color: var(--secondary);
        }

        .measurement-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            color: var(--dark);
        }

        .controls-row {
            display: flex;
            gap: 1rem;
            width: 100%;
            max-width: 500px;
        }

        .btn {
            flex: 1;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #FF8C42);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--secondary);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #00F5A0);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning), #FFE66D);
            color: var(--dark);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 50;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .crosshair::before {
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            transform: translateY(-50%);
        }

        .crosshair::after {
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 29, 41, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--light);
            color: var(--dark);
            padding: 2rem;
            border-radius: 1.5rem;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--secondary);
        }

        .room-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .room-card {
            padding: 1.5rem;
            background: white;
            border: 2px solid var(--overlay);
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .room-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--shadow);
        }

        .room-card.selected {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.1), rgba(0, 217, 255, 0.1));
        }

        .room-name {
            font-weight: 600;
            font-size: 1.125rem;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        .room-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1A1D29 0%, #2D3142 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            padding: 2rem;
        }

        #welcome-screen.hidden {
            display: none;
        }

        .welcome-content {
            max-width: 600px;
            text-align: center;
        }

        .welcome-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-subtitle {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .feature-list {
            text-align: left;
            margin-bottom: 2rem;
            display: inline-block;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .feature-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }

        .error-message {
            background: #FF4444;
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        @media (max-width: 640px) {
            .welcome-title {
                font-size: 2rem;
            }
            
            .info-panel {
                padding: 1rem;
            }
            
            .controls-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Welcome Screen -->
    <div id="welcome-screen">
        <div class="welcome-content">
            <h1 class="welcome-title">AR Room Modeler</h1>
            <p class="welcome-subtitle">Measure and model rooms using augmented reality</p>
            
            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon">1</div>
                    <div>Establish floor plane with AR</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">2</div>
                    <div>Mark corners to define room boundaries</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">3</div>
                    <div>Auto-detect ceiling height</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">4</div>
                    <div>Export 3D models for web display</div>
                </div>
            </div>

            <button class="btn btn-primary" onclick="startAR()" style="width: 100%; max-width: 300px; margin: 0 auto;">
                Start AR Session
            </button>

            <div id="error-display" class="error-message"></div>
        </div>
    </div>

    <!-- AR Container -->
    <div id="ar-container" style="display: none;">
        <video id="camera-view" autoplay playsinline></video>
        <canvas id="canvas-overlay"></canvas>
        
        <div class="crosshair"></div>

        <!-- Top HUD -->
        <div class="hud top-bar">
            <div class="logo">AR Room Modeler</div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="status-text">Ready</span>
            </div>
        </div>

        <!-- Bottom HUD -->
        <div class="hud bottom-controls">
            <div id="info-panel" class="info-panel" style="display: none;">
                <div class="info-header">Current Room</div>
                <div class="measurement-grid" id="measurements">
                    <div class="measurement-item">
                        <span class="measurement-label">Corners Marked</span>
                        <span class="measurement-value" id="corner-count">0 / 4</span>
                    </div>
                </div>
            </div>

            <div class="controls-row">
                <button id="establish-floor-btn" class="btn btn-primary">Establish Floor</button>
                <button id="mark-corner-btn" class="btn btn-secondary" disabled>Mark Corner</button>
            </div>

            <div class="controls-row">
                <button id="complete-room-btn" class="btn btn-success" disabled>Complete Room</button>
                <button id="new-room-btn" class="btn btn-warning" disabled>New Room</button>
                <button id="export-btn" class="btn btn-secondary" disabled>Export</button>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="export-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Export Options</div>
            <div class="room-list" id="room-list"></div>
            <div class="controls-row">
                <button class="btn btn-primary" onclick="exportModel()">Export Selected</button>
                <button class="btn btn-secondary" onclick="closeExportModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        // State management
        const state = {
            arActive: false,
            floorEstablished: false,
            corners: [],
            rooms: [],
            currentRoom: null,
            ceilingHeight: 2.4, // Default 2.4m
            videoStream: null,
            canvas: null,
            ctx: null,
            floorPlane: null,
            deviceOrientation: { alpha: 0, beta: 0, gamma: 0 },
            cameraMatrix: null
        };

        // Initialize canvas
        function initCanvas() {
            state.canvas = document.getElementById('canvas-overlay');
            state.ctx = state.canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            state.canvas.width = window.innerWidth;
            state.canvas.height = window.innerHeight;
        }

        // Start AR session
        window.startAR = async function() {
            try {
                // Check for AR support
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('Camera access not supported');
                }

                // Request device orientation FIRST (iOS requires this to happen in user gesture)
                if (typeof DeviceOrientationEvent !== 'undefined' && 
                    typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const permission = await DeviceOrientationEvent.requestPermission();
                        if (permission === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        } else {
                            throw new Error('Motion permission denied. Please allow motion access in Settings > Safari > Motion & Orientation Access');
                        }
                    } catch (error) {
                        if (error.message.includes('user gesture')) {
                            throw new Error('Please tap the button to enable AR features');
                        }
                        throw error;
                    }
                } else {
                    // Non-iOS devices
                    window.addEventListener('deviceorientation', handleOrientation);
                }

                // Request camera permission
                state.videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });

                const video = document.getElementById('camera-view');
                video.srcObject = state.videoStream;

                // Hide welcome, show AR
                document.getElementById('welcome-screen').classList.add('hidden');
                document.getElementById('ar-container').style.display = 'block';
                
                initCanvas();
                state.arActive = true;
                updateStatus('Point camera at floor');

            } catch (error) {
                showError('Failed to start AR: ' + error.message);
            }
        };

        function handleOrientation(event) {
            state.deviceOrientation = {
                alpha: event.alpha || 0,
                beta: event.beta || 0,
                gamma: event.gamma || 0
            };
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-display');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
            setTimeout(() => errorDiv.classList.remove('active'), 5000);
        }

        function updateStatus(text) {
            document.getElementById('status-text').textContent = text;
        }

        // Establish floor plane
        document.getElementById('establish-floor-btn').addEventListener('click', () => {
            // Simulate floor plane detection (in real AR, this would use hit-testing)
            state.floorPlane = {
                center: { x: 0, y: 0, z: 0 },
                normal: { x: 0, y: 1, z: 0 }
            };
            
            state.floorEstablished = true;
            state.corners = [];
            state.currentRoom = {
                id: Date.now(),
                name: `Room ${state.rooms.length + 1}`,
                corners: [],
                walls: [],
                floor: null,
                ceiling: null,
                measurements: {}
            };

            document.getElementById('mark-corner-btn').disabled = false;
            document.getElementById('info-panel').style.display = 'block';
            updateStatus('Mark corners (tap Mark Corner button)');
            updateMeasurements();
        });

        // Mark corner
        document.getElementById('mark-corner-btn').addEventListener('click', () => {
            if (state.corners.length >= 4) {
                return;
            }

            // Simulate corner marking at center of screen
            // In real AR, this would raycast to floor plane
            const corner = {
                x: Math.random() * 5 - 2.5, // Simulated position
                y: 0,
                z: Math.random() * 5 - 2.5,
                screenX: state.canvas.width / 2,
                screenY: state.canvas.height / 2
            };

            state.corners.push(corner);
            state.currentRoom.corners.push(corner);

            // Draw on canvas
            drawCorners();
            updateMeasurements();

            if (state.corners.length === 4) {
                document.getElementById('complete-room-btn').disabled = false;
                updateStatus('Room corners marked - Complete Room');
            } else {
                updateStatus(`Mark corner ${state.corners.length + 1} of 4`);
            }
        });

        // Draw corners and connecting lines
        function drawCorners() {
            state.ctx.clearRect(0, 0, state.canvas.width, state.canvas.height);

            if (state.corners.length === 0) return;

            // Project 3D corners to 2D screen space
            const projectedCorners = state.corners.map((corner, index) => {
                // Simple perspective projection simulation
                const scale = 500 / (5 + corner.z);
                return {
                    x: state.canvas.width / 2 + corner.x * scale,
                    y: state.canvas.height / 2 + corner.y * scale,
                    label: index + 1
                };
            });

            // Draw lines connecting corners
            state.ctx.strokeStyle = '#00D9FF';
            state.ctx.lineWidth = 3;
            state.ctx.shadowColor = '#00D9FF';
            state.ctx.shadowBlur = 10;
            state.ctx.beginPath();

            for (let i = 0; i < projectedCorners.length; i++) {
                const corner = projectedCorners[i];
                if (i === 0) {
                    state.ctx.moveTo(corner.x, corner.y);
                } else {
                    state.ctx.lineTo(corner.x, corner.y);
                }
            }

            // Close the loop if all 4 corners are marked
            if (projectedCorners.length === 4) {
                state.ctx.closePath();
            }

            state.ctx.stroke();

            // Draw corner markers
            projectedCorners.forEach(corner => {
                state.ctx.fillStyle = '#FF6B35';
                state.ctx.shadowColor = '#FF6B35';
                state.ctx.beginPath();
                state.ctx.arc(corner.x, corner.y, 8, 0, Math.PI * 2);
                state.ctx.fill();

                // Draw label
                state.ctx.fillStyle = '#FFFFFF';
                state.ctx.font = 'bold 14px Outfit';
                state.ctx.shadowBlur = 5;
                state.ctx.shadowColor = '#000000';
                state.ctx.textAlign = 'center';
                state.ctx.textBaseline = 'middle';
                state.ctx.fillText(corner.label, corner.x, corner.y);
            });

            state.ctx.shadowBlur = 0;
        }

        // Calculate room measurements
        function calculateMeasurements() {
            if (state.corners.length < 2) return {};

            const measurements = {};
            
            // Calculate wall lengths
            for (let i = 0; i < state.corners.length; i++) {
                const c1 = state.corners[i];
                const c2 = state.corners[(i + 1) % state.corners.length];
                const dx = c2.x - c1.x;
                const dz = c2.z - c1.z;
                const length = Math.sqrt(dx * dx + dz * dz);
                measurements[`wall${i + 1}`] = length.toFixed(2);
            }

            // Calculate floor area
            if (state.corners.length === 4) {
                const area = calculatePolygonArea(state.corners);
                measurements.floorArea = area.toFixed(2);
                measurements.ceilingHeight = state.ceilingHeight.toFixed(2);
                measurements.volume = (area * state.ceilingHeight).toFixed(2);
            }

            return measurements;
        }

        function calculatePolygonArea(corners) {
            let area = 0;
            for (let i = 0; i < corners.length; i++) {
                const c1 = corners[i];
                const c2 = corners[(i + 1) % corners.length];
                area += (c1.x * c2.z - c2.x * c1.z);
            }
            return Math.abs(area / 2);
        }

        function updateMeasurements() {
            const measurements = calculateMeasurements();
            state.currentRoom.measurements = measurements;

            let html = `
                <div class="measurement-item">
                    <span class="measurement-label">Corners Marked</span>
                    <span class="measurement-value">${state.corners.length} / 4</span>
                </div>
            `;

            if (measurements.wall1) {
                for (let i = 1; i <= 4 && measurements[`wall${i}`]; i++) {
                    html += `
                        <div class="measurement-item">
                            <span class="measurement-label">Wall ${i}</span>
                            <span class="measurement-value">${measurements[`wall${i}`]} m</span>
                        </div>
                    `;
                }
            }

            if (measurements.floorArea) {
                html += `
                    <div class="measurement-item">
                        <span class="measurement-label">Floor Area</span>
                        <span class="measurement-value">${measurements.floorArea} m²</span>
                    </div>
                    <div class="measurement-item">
                        <span class="measurement-label">Ceiling Height</span>
                        <span class="measurement-value">${measurements.ceilingHeight} m</span>
                    </div>
                    <div class="measurement-item">
                        <span class="measurement-label">Volume</span>
                        <span class="measurement-value">${measurements.volume} m³</span>
                    </div>
                `;
            }

            document.getElementById('measurements').innerHTML = html;
            document.getElementById('corner-count').textContent = `${state.corners.length} / 4`;
        }

        // Complete room
        document.getElementById('complete-room-btn').addEventListener('click', () => {
            if (state.corners.length !== 4) return;

            // Create room geometry
            state.currentRoom.floor = createFloorGeometry();
            state.currentRoom.ceiling = createCeilingGeometry();
            state.currentRoom.walls = createWallGeometries();

            state.rooms.push(state.currentRoom);
            
            updateStatus('Room completed!');
            document.getElementById('new-room-btn').disabled = false;
            document.getElementById('export-btn').disabled = false;
            document.getElementById('complete-room-btn').disabled = true;
            document.getElementById('mark-corner-btn').disabled = true;
        });

        // Start new room
        document.getElementById('new-room-btn').addEventListener('click', () => {
            state.floorEstablished = false;
            state.corners = [];
            state.currentRoom = null;
            state.ctx.clearRect(0, 0, state.canvas.width, state.canvas.height);
            
            document.getElementById('info-panel').style.display = 'none';
            document.getElementById('mark-corner-btn').disabled = true;
            document.getElementById('complete-room-btn').disabled = true;
            
            updateStatus('Point camera at floor for new room');
        });

        // Create geometries
        function createFloorGeometry() {
            return {
                type: 'floor',
                vertices: state.corners.map(c => ({ x: c.x, y: 0, z: c.z })),
                color: 'rgba(0, 217, 255, 0.3)',
                label: 'Floor'
            };
        }

        function createCeilingGeometry() {
            return {
                type: 'ceiling',
                vertices: state.corners.map(c => ({ x: c.x, y: state.ceilingHeight, z: c.z })),
                color: 'rgba(255, 107, 53, 0.3)',
                label: 'Ceiling'
            };
        }

        function createWallGeometries() {
            const walls = [];
            for (let i = 0; i < state.corners.length; i++) {
                const c1 = state.corners[i];
                const c2 = state.corners[(i + 1) % state.corners.length];
                
                walls.push({
                    type: 'wall',
                    vertices: [
                        { x: c1.x, y: 0, z: c1.z },
                        { x: c2.x, y: 0, z: c2.z },
                        { x: c2.x, y: state.ceilingHeight, z: c2.z },
                        { x: c1.x, y: state.ceilingHeight, z: c1.z }
                    ],
                    color: 'rgba(0, 78, 137, 0.3)',
                    label: `Wall ${i + 1}`,
                    length: Math.sqrt(Math.pow(c2.x - c1.x, 2) + Math.pow(c2.z - c1.z, 2))
                });
            }
            return walls;
        }

        // Export functionality
        document.getElementById('export-btn').addEventListener('click', () => {
            document.getElementById('export-modal').classList.add('active');
            renderRoomList();
        });

        window.closeExportModal = function() {
            document.getElementById('export-modal').classList.remove('active');
        };

        function renderRoomList() {
            const listEl = document.getElementById('room-list');
            listEl.innerHTML = state.rooms.map((room, index) => `
                <div class="room-card" data-index="${index}" onclick="toggleRoomSelection(${index})">
                    <div class="room-name">${room.name}</div>
                    <div class="room-stats">
                        <span>Area: ${room.measurements.floorArea}m²</span>
                        <span>Height: ${room.measurements.ceilingHeight}m</span>
                    </div>
                </div>
            `).join('');
        }

        window.toggleRoomSelection = function(index) {
            const cards = document.querySelectorAll('.room-card');
            cards[index].classList.toggle('selected');
        };

        window.exportModel = function() {
            const selectedRooms = Array.from(document.querySelectorAll('.room-card.selected'))
                .map(el => parseInt(el.dataset.index))
                .map(i => state.rooms[i]);

            if (selectedRooms.length === 0) {
                alert('Please select at least one room to export');
                return;
            }

            // Create GLB export data
            const glbData = createGLBExport(selectedRooms);
            
            // Create JSON export data
            const jsonData = createJSONExport(selectedRooms);

            // Download files
            downloadFile(glbData.blob, 'room-model.glb');
            downloadFile(jsonData.blob, 'room-model.json');

            closeExportModal();
            updateStatus('Model exported successfully!');
        };

        function createGLBExport(rooms) {
            // Simplified GLB structure
            const vertices = [];
            const indices = [];
            const colors = [];

            rooms.forEach(room => {
                // Add floor
                addPolygonToMesh(room.floor, vertices, indices, colors);
                // Add ceiling
                addPolygonToMesh(room.ceiling, vertices, indices, colors);
                // Add walls
                room.walls.forEach(wall => addPolygonToMesh(wall, vertices, indices, colors));
            });

            const glbJSON = {
                asset: { version: "2.0", generator: "AR Room Modeler" },
                scene: 0,
                scenes: [{ nodes: [0] }],
                nodes: [{ mesh: 0 }],
                meshes: [{
                    primitives: [{
                        attributes: { POSITION: 0, COLOR_0: 1 },
                        indices: 2
                    }]
                }],
                accessors: [
                    { bufferView: 0, componentType: 5126, count: vertices.length / 3, type: "VEC3" },
                    { bufferView: 1, componentType: 5126, count: colors.length / 4, type: "VEC4" },
                    { bufferView: 2, componentType: 5123, count: indices.length, type: "SCALAR" }
                ],
                bufferViews: [
                    { buffer: 0, byteOffset: 0, byteLength: vertices.length * 4 },
                    { buffer: 0, byteOffset: vertices.length * 4, byteLength: colors.length * 4 },
                    { buffer: 0, byteOffset: (vertices.length + colors.length) * 4, byteLength: indices.length * 2 }
                ]
            };

            const jsonString = JSON.stringify(glbJSON);
            const jsonBuffer = new TextEncoder().encode(jsonString);
            
            const blob = new Blob([jsonBuffer], { type: 'model/gltf-binary' });
            
            return { blob, data: glbJSON };
        }

        function createJSONExport(rooms) {
            const data = {
                version: "1.0",
                generator: "AR Room Modeler",
                timestamp: new Date().toISOString(),
                rooms: rooms.map(room => ({
                    id: room.id,
                    name: room.name,
                    measurements: room.measurements,
                    floor: room.floor,
                    ceiling: room.ceiling,
                    walls: room.walls.map((wall, i) => ({
                        ...wall,
                        dimensions: {
                            length: room.measurements[`wall${i + 1}`],
                            height: room.measurements.ceilingHeight
                        }
                    }))
                }))
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            return { blob, data };
        }

        function addPolygonToMesh(polygon, vertices, indices, colors) {
            const startIndex = vertices.length / 3;
            
            // Add vertices
            polygon.vertices.forEach(v => {
                vertices.push(v.x, v.y, v.z);
            });

            // Add color (parse rgba)
            const colorMatch = polygon.color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+),?\s*([\d.]+)?\)/);
            const r = parseInt(colorMatch[1]) / 255;
            const g = parseInt(colorMatch[2]) / 255;
            const b = parseInt(colorMatch[3]) / 255;
            const a = parseFloat(colorMatch[4] || 1);

            for (let i = 0; i < polygon.vertices.length; i++) {
                colors.push(r, g, b, a);
            }

            // Add indices (triangulate)
            for (let i = 1; i < polygon.vertices.length - 1; i++) {
                indices.push(startIndex, startIndex + i, startIndex + i + 1);
            }
        }

        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Animation loop for rendering
        function animate() {
            if (state.arActive && state.corners.length > 0) {
                drawCorners();
            }
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
